<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Loopschema">
  <meta name="theme-color" content="#f4f2ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121314" media="(prefers-color-scheme: dark)">
  <title>Loopschema</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>
  <script>
    // Start de app niet, laat dan zien waarom (in plaats van een leeg scherm) met een knop om te herstellen.
    (function () {
      var app = document.getElementById('app');
      function toon(reden) {
        if (app.children.length && !app.querySelector('[data-test=startfout]')) return;
        var tekst = String(reden && (reden.message || reden) || 'onbekende fout');
        app.innerHTML = '<div data-test="startfout"><h1>De app start niet</h1>' +
          '<p class="uitleg">Tik op Herstellen: de app haalt dan alles opnieuw op. Je gegevens blijven bewaard.</p>' +
          '<button type="button" class="knop" data-test="herstellen">Herstellen</button>' +
          '<p class="hint">Foutmelding: <span data-test="fouttekst"></span></p></div>';
        app.querySelector('[data-test=fouttekst]').textContent = tekst;
        app.querySelector('[data-test=herstellen]').onclick = async function () {
          try {
            var sws = await navigator.serviceWorker.getRegistrations();
            await Promise.all(sws.map(function (r) { return r.unregister(); }));
            var sleutels = await caches.keys();
            await Promise.all(sleutels.map(function (k) { return caches.delete(k); }));
          } catch (e) { /* dan in elk geval opnieuw laden */ }
          location.reload();
        };
      }
      window.toonStartfout = toon;
      addEventListener('error', function (e) {
        toon(e.error || e.message || ('kon ' + (e.target && (e.target.src || e.target.href)) + ' niet laden'));
      }, true);
      addEventListener('unhandledrejection', function (e) { toon(e.reason); });
      setTimeout(function () { if (!app.children.length) toon('de app startte niet binnen 15 seconden'); }, 15000);
    })();
  </script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
